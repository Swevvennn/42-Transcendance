services:
  #lance la db
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}q
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  #2e conteneur app next.js
  app:
    #build . = cherche le dockerfile ds le dossier actuel ou se trv le .yml 
    build: .
    restart: always
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
    depends_on:
      - db

  #Le vigile Nginx
  nginx:
    build: ./nginx  # On dit à Docker d'aller lire le Dockerfile dans le dossier nginx
    restart: always
    ports:
      - "443:443"   # La SEULE porte ouverte vers l'extérieur (ton vrai PC)
    depends_on:
      - app         # On ne démarre Nginx que si l'app Next.js est allumée

#save la db sur le vrai disque dur
volumes:
    db_data:
