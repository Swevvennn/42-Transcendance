# ${VAR:?message} = variable obligatoire : si elle manque ou est vide dans le
# .env, `docker compose` refuse de demarrer et affiche le message.
# ${VAR:-defaut} = variable optionnelle avec une valeur par defaut.

services:
#lance la db
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?a definir dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?a definir dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?a definir dans .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  #2e conteneur app next.js
  app:
    #build . = cherche le dockerfile ds le dossier actuel ou se trv le .yml
    build: .
    restart: always
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
      # Better Auth : cle secrete des cookies de session + adresse publique du site (nginx)
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?a definir dans .env (openssl rand -base64 32)}
      BETTER_AUTH_URL: ${PUBLIC_URL:-https://localhost:${HTTPS_PORT:-8443}}
      # Connexion avec 42 (optionnel : sans ces 2 valeurs, le bouton affiche une erreur)
      FT_CLIENT_ID: ${FT_CLIENT_ID:-}
      FT_CLIENT_SECRET: ${FT_CLIENT_SECRET:-}
      # Comptes de test (prisma/seed.ts) : optionnel, le seed refuse de tourner sans
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    # L'app est "healthy" quand elle repond vraiment. /api/auth/ok est une
    # petite route de Better Auth qui renvoie {"ok":true}. L'image n'a ni curl
    # ni wget : on utilise bun lui-meme pour faire la requete.
    # exit 0 = sain, exit 1 = pas encore pret.
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/api/auth/ok').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      # Les migrations Prisma tournent avant le serveur : 30 s de grace pendant
      # lesquelles un echec ne compte pas.
      start_period: 30s

  #Le vigile Nginx
  nginx:
    build: ./nginx  # On dit à Docker d'aller lire le Dockerfile dans le dossier nginx
    restart: always
    environment:
      # Lu par le template nginx.conf (redirection HTTP -> HTTPS vers le bon port)
      HTTPS_PORT: ${HTTPS_PORT:-8443}
    ports:
      # Les SEULES portes ouvertes vers l'extérieur (ton vrai PC) : https://localhost:8443
      # Le Docker "rootless" des postes 42 ne peut pas ouvrir 443 / 80 (port < 1024).
      # Ailleurs on peut mettre HTTPS_PORT=443 et HTTP_PORT=80 dans le .env.
      - "${HTTPS_PORT:-8443}:443"
      # HTTP : ne sert qu'a rediriger vers HTTPS
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      # On ne démarre Nginx que quand l'app Next.js repond (sinon erreurs 502)
      app:
        condition: service_healthy
      # nginx cherche l'adresse de "grafana" au demarrage : il doit exister
      grafana:
        condition: service_started

  # ---------------------------------------------------------------------
  # MONITORING. Aucun de ces services n'a de "ports:" : ils ne sont
  # joignables que sur le reseau Docker interne. Seul Grafana est visible,
  # et uniquement a travers nginx (https://localhost:8443/grafana/).
  # Versions figees (pas de :latest) : une nouvelle version ne peut pas
  # casser la stack toute seule la veille de l'evaluation.
  # ---------------------------------------------------------------------

  # Collecteur de métriques : lit /metrics toutes les 15s et garde l'historique.
  # Il evalue aussi les regles d'alerte (prometheus/alerts.yml).
  prometheus:
    image: prom/prometheus:v3.16.0
    restart: always
    volumes:
      # Tout le dossier (prometheus.yml + alerts.yml), en lecture seule
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    depends_on:
      app:
        condition: service_healthy

  # Exporter Postgres : se connecte a la base comme un client normal, lit ses
  # statistiques internes (connexions, taille, transactions...) et les
  # traduit au format texte de Prometheus sur le port 9187.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.21.1
    restart: always
    environment:
      # sslmode=disable : la base est sur le reseau interne, sans TLS
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy

  # Exporter "machine" : CPU, RAM, disque, reseau, lus dans /proc et /sys,
  # exposes sur le port 9100.
  node-exporter:
    image: prom/node-exporter:v1.13.1
    restart: always

  # cAdvisor : CPU / RAM PAR CONTENEUR (app, db, nginx...), la ou
  # node-exporter ne voit que la machine entiere. Port interne 8080.
  # Il lit les compteurs du noyau (cgroups, dans /sys) et trouve les noms des
  # conteneurs par les sockets de Docker et containerd.
  # On ne monte QUE / et /sys, qui existent partout. Surtout pas /var/run:ro :
  # Podman doit creer /run/.containerenv dans le conteneur, et un /run en
  # lecture seule fait echouer le demarrage. Les sockets sont lus a travers
  # /rootfs : s'ils n'existent pas, cAdvisor demarre quand meme (mais sans
  # donnees par conteneur). Plus besoin de "privileged".
  # Attention : ":ro" protege les fichiers, pas l'API derriere un socket.
  # cAdvisor reste donc un service de confiance, jamais expose.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.61.1
    restart: always
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
    command:
      # Moins de travail : on ne garde que les metriques utiles au dashboard
      - --docker_only=true
      - --enable_metrics=cpu,memory,network
      - --housekeeping_interval=15s
      - --docker=unix:///rootfs/run/docker.sock
      - --containerd=/rootfs/run/containerd/containerd.sock

  # Grafana : le site qui dessine les courbes a partir de Prometheus.
  # Pas de "ports:" : on y accede seulement par nginx, sur /grafana/.
  grafana:
    image: grafana/grafana:13.3.2
    restart: always
    environment:
      # Compte admin, lu dans le .env. Attention : n'est applique qu'a la
      # TOUTE PREMIERE creation du volume grafana_data (voir README).
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?a definir dans .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?a definir dans .env}
      # Personne ne peut se creer un compte, pas d'acces anonyme
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Grafana est servi sous /grafana/ (et non a la racine du site) :
      # il doit le savoir pour generer ses liens et ses redirections.
      GF_SERVER_ROOT_URL: "https://localhost:${HTTPS_PORT:-8443}/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Pas d'appel a internet (stats d'usage, verification de mises a jour)
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      # Provisioning : source de donnees + dashboard crees au demarrage
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana-dashboards:ro
    depends_on:
      - prometheus

#save la db sur le vrai disque dur
volumes:
    db_data:
    prometheus_data:
    grafana_data:
