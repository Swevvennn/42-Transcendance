events {}

# Ce fichier est un "template" : au demarrage du conteneur, l'image nginx
# remplace ${HTTPS_PORT} par la valeur de la variable d'environnement
# (envsubst), puis ecrit le resultat dans /etc/nginx/nginx.conf.
# Seules les variables d'environnement qui existent sont remplacees :
# $host, $remote_addr... (variables de nginx) ne sont pas touchees.

http {
	# pr que nginx cache son num de version au navigateur
	server_tokens off;
    # "Connection: upgrade" si le navigateur demande un WebSocket, sinon "close".
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Port 80 (HTTP) : on ne sert rien en clair, on renvoie vers HTTPS.
    # 301 = "deplace definitivement" : le navigateur refait la requete en https.
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host:${HTTPS_PORT}$request_uri;
    }

    server {
        # Nginx écoute sur le port 443 et active le mode SSL (HTTPS)
        listen 443 ssl;
        server_name localhost;

        # On lui dit où trouver les clés qu'on vient de générer
        ssl_certificate /etc/nginx/ssl/pong.crt;
        ssl_certificate_key /etc/nginx/ssl/pong.key;

        # Le protocole de chiffrement autorisé (sécurité standard)
        ssl_protocols TLSv1.2 TLSv1.3;

        # Quelqu'un tape http:// sur le port HTTPS : nginx produit l'erreur 497
        # ("requete HTTP envoyee sur un port HTTPS"). On la transforme en
        # redirection vers la meme adresse en https.
        error_page 497 =301 https://$http_host$request_uri;

        # En-tetes de securite, ajoutes a toutes les reponses ("always" = meme
        # sur les erreurs). Ils sont ici, au niveau server : un add_header dans
        # un location annulerait tous ceux-ci pour ce location.
        # HSTS : le navigateur n'utilisera plus que HTTPS pour ce site pendant
        # 1 an (il l'ignore tant que le certificat auto-signe n'est pas accepte).
        add_header Strict-Transport-Security "max-age=31536000" always;
        # Interdit au navigateur de "deviner" le type d'un fichier (ex : traiter
        # une image envoyee par un joueur comme du JavaScript).
        add_header X-Content-Type-Options "nosniff" always;
        # Interdit d'afficher notre site dans une <iframe> d'un autre site
        # (clickjacking : un faux bouton par-dessus notre page).
        add_header X-Frame-Options "DENY" always;

        # On transmet les vraies infos du joueur (son IP, etc.) au backend.
        # Ecrits au niveau server : les 2 location ci-dessous en heritent
        # (un proxy_set_header dans un location annulerait cet heritage).
        # $http_host garde le port (localhost:8443) : Better Auth et les
        # Server Actions de Next comparent cette adresse à celle du navigateur.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr = l'IP qui s'est vraiment connectee a nginx. On ne
        # recopie PAS le X-Forwarded-For envoye par le client : il pourrait y
        # mettre une fausse IP et contourner la limite de tentatives de login.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (Socket.IO pour le jeu en ligne) : on laisse passer
        # la demande de "upgrade" de HTTP vers WebSocket.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Socket.IO (jeu en ligne) : la connexion reste ouverte longtemps.
        # nginx la coupe si rien ne passe pendant ce delai. Socket.IO envoie
        # un "ping" toutes les 25 s, donc 60 s laisse de la marge.
        location /socket.io/ {
            proxy_pass http://app:3000;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Que faire quand une requête arrive ?
        location / {
            # LE REVERSE PROXY : On redirige tout vers le conteneur 'app' sur le port 3000
            proxy_pass http://app:3000;
        }
    }
}
