events {}

http {
    # "Connection: upgrade" si le navigateur demande un WebSocket, sinon "close".
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        # Nginx écoute sur le port 443 et active le mode SSL (HTTPS)
        listen 443 ssl;
        server_name localhost;

        # On lui dit où trouver les clés qu'on vient de générer
        ssl_certificate /etc/nginx/ssl/pong.crt;
        ssl_certificate_key /etc/nginx/ssl/pong.key;

        # Le protocole de chiffrement autorisé (sécurité standard)
        ssl_protocols TLSv1.2 TLSv1.3;

        # Que faire quand une requête arrive ?
        location / {
            # LE REVERSE PROXY : On redirige tout vers le conteneur 'app' sur le port 3000
            proxy_pass http://app:3000;
            
            # On transmet les vraies infos du joueur (son IP, etc.) au backend
            # $http_host garde le port (localhost:8443) : Better Auth et les
            # Server Actions de Next comparent cette adresse à celle du navigateur.
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket (Socket.IO pour le jeu en ligne) : on laisse passer
            # la demande de "upgrade" de HTTP vers WebSocket.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
