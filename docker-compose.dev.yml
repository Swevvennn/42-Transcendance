# Database only, for local development with `bun run dev`.
# Start: bun run db:up   — Stop: bun run db:down
# The port is bound to 127.0.0.1 only: not reachable from other machines.
name: transcendence-dev

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_dev_data:/var/lib/postgresql/data

volumes:
  db_dev_data:
