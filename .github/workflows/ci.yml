name: CI

on:
  push:
    branches: [main, devops/infra-base]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      # 1. Télécharge le code du repo sur le serveur GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installe bun sur le serveur Linux
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 3. Installe les paquets (lance aussi `prisma generate` via postinstall)
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 4. Vérifie les règles de code (Norminette JS/TS)
      - name: Lint
        run: bun run lint

      # 5. Génère les types Next.js (.next/types) avant de lancer tsc
      - name: Generate Next.js types
        run: bunx next typegen

      # 6. Vérifie qu'il n'y a aucune erreur de typage TypeScript
      - name: Typecheck
        run: bunx tsc --noEmit

      # 7. Compile Next.js comme dans le Dockerfile (avec de fausses variables .env)
      - name: Build
        run: bun run build
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
          BETTER_AUTH_SECRET: "ci-dummy-secret-key-for-build-only-32chars"
          BETTER_AUTH_URL: "http://localhost:3000"