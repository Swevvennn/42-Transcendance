global:
  # Fréquence à laquelle Prometheus va lire les pages /metrics
  scrape_interval: 15s
  # Frequence a laquelle Prometheus verifie les regles d'alerte
  evaluation_interval: 15s

# Fichier des regles d'alerte (chemin relatif a ce fichier : /etc/prometheus/)
rule_files:
  - "alerts.yml"

scrape_configs:
  # 1. Prometheus se surveille lui-même (sa propre RAM / santé)
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 2. Notre serveur Next.js + Socket.IO (via le réseau interne Docker)
  - job_name: "pongo-app"
    static_configs:
      - targets: ["app:3000"]

  # 3. PostgreSQL, via postgres-exporter (qui traduit les stats de la base)
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # 4. La machine (CPU, RAM, disque, reseau), via node-exporter
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  # 5. Les conteneurs un par un (CPU / RAM de app, db, nginx...), via cAdvisor
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
