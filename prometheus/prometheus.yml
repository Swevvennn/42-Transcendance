global:
  # Fréquence à laquelle Prometheus va lire les pages /metrics
  scrape_interval: 15s

scrape_configs:
  # 1. Prometheus se surveille lui-même (sa propre RAM / santé)
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 2. Notre serveur Next.js + Socket.IO (via le réseau interne Docker)
  - job_name: "pongo-app"
    static_configs:
      - targets: ["app:3000"]

  # 3. PostgreSQL, via postgres-exporter (qui traduit les stats de la base)
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # 4. La machine (CPU, RAM, disque, reseau), via node-exporter
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
